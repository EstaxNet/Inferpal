name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # A job without a budget turns one hung test into the runner's six-hour default, and the
    # log is only uploaded when the job ENDS — so the hang costs an hour and names nothing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Inferpal.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Inferpal/Inferpal.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

  # §23: editor-agnostic net8.0 leg (Core + Host) on the OSes the VS Code extension targets.
  # The VSIX project only exists on the net8.0-windows TFM, which the csproj drops off-Windows,
  # so restore/build here never touch the VS SDK. This is also where the bash dialect of
  # ShellStateProtocol runs against a real /bin/bash.
  test-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # --blame-hang NAMES the test that never returned. Without it a hung test kills the job
      # with no log at all: the run reports 46 minutes, an unfinished step and nothing to read,
      # which is indistinguishable from a lost runner. The budget is generous next to the 2.5
      # minutes this leg takes, so it only ever fires on a real hang.
      - name: Test (net8.0 editor-agnostic slice)
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --blame-hang --blame-hang-timeout 6m

  # VS Code extension: typecheck + bundle (no Windows dependency — cheaper runner)
  vscode-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Typecheck
        working-directory: vscode
        run: npm run typecheck

      - name: Bundle
        working-directory: vscode
        run: npm run build
