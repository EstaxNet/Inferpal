name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # A job without a budget turns one hung test into the runner's six-hour default, and the
    # log is only uploaded when the job ENDS — so the hang costs an hour and names nothing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Inferpal.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Inferpal/Inferpal.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

  # §23: editor-agnostic net8.0 leg (Core + Host) on the OSes the VS Code extension targets.
  # The VSIX project only exists on the net8.0-windows TFM, which the csproj drops off-Windows,
  # so restore/build here never touch the VS SDK. This is also where the bash dialect of
  # ShellStateProtocol runs against a real /bin/bash.
  test-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # ⚠ macOS does not gate the verdict, and that is a MEASUREMENT, not a shrug: on that leg an
    # in-shell watchdog (9 min), the step budget (12) and the job budget (30) all failed to end a
    # hung step — at 33 minutes it was still running. A test cannot stop the agent from applying
    # its own budgets; a wedged agent can, which also explains why no log is ever uploaded. A leg
    # that hangs six runs out of ten and produces nothing to read already gives no signal, so
    # blocking on it only costs the feedback loop. It still runs, and a green one still counts.
    # The image is pinned (macos-latest moved to arm64): if the hang stops here, it was the image.
    continue-on-error: ${{ matrix.os == 'macos-13' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # ⚠ Three steps rather than one, each with its own budget. A job killed by `timeout-minutes`
      # uploads NO log at all, so the only thing readable from outside is the per-step status —
      # granular enough to say WHERE it hung, and nothing else is. `dotnet test` alone restores,
      # builds and runs: collapsing the three made "the macOS leg hangs" unanswerable, and
      # --blame-hang cannot name a test when the tests never started.
      - name: Restore (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet restore Inferpal.Tests/Inferpal.Tests.csproj

      - name: Build (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet build Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

      # `--blame-hang` names the test when the hang is inside one; the detailed logger covers the
      # case where it is not (a host that never exits once every test has passed).
      # ⚠ The in-shell watchdog that used to live here is GONE: measured twice, it never ended the
      # step — keeping a guard that does not fire is worse than not having one, because it reads as
      # protection. What stays is what costs nothing and did produce information: the output in a
      # file (a surviving `testhost` holding the step's pipe keeps the step alive), the step budget,
      # and the dump below.
      - name: Test (net8.0 editor-agnostic slice)
        timeout-minutes: 12
        run: |
          set +e
          dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 5m \
            > test-output.log 2>&1
          code=$?
          echo "dotnet test exit=$code"
          exit $code

      # Runs even when the step above was killed by its own budget: that is the whole point.
      - name: Test output (tail)
        if: always()
        run: |
          echo "── last 3000 lines of the test output ──"
          tail -n 3000 test-output.log || echo "no test-output.log was produced"

  # VS Code extension: typecheck + bundle (no Windows dependency — cheaper runner)
  vscode-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Typecheck
        working-directory: vscode
        run: npm run typecheck

      - name: Bundle
        working-directory: vscode
        run: npm run build
