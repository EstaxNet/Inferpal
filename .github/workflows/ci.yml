name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# ⚠ A build server DETACHES on purpose — an MSBuild node survives its run for fifteen minutes to
# be reused, and so does VBCSCompiler. Anything it started is then OUTSIDE the process tree a
# timeout kills, and it keeps the output pipes it inherited open for as long as it lives. A reader
# waits for the last holder, not for the process it launched: that is how a step whose process is
# dead stays `in_progress`, with no log and no `if: always()` step to print one. Measured on the
# macOS leg, in its own cleanup: `Terminate orphan process: pid (25287) (sleep)` beside
# `(VBCSCompiler)`. Nothing in CI is built twice, so a warm node buys nothing here.
env:
  MSBUILDDISABLENODEREUSE: 1
  DOTNET_CLI_USE_MSBUILD_SERVER: 0
  UseSharedCompilation: false

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # A job without a budget turns one hung test into the runner's six-hour default, and the
    # log is only uploaded when the job ENDS — so the hang costs an hour and names nothing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Inferpal.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Inferpal/Inferpal.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

  # §23: editor-agnostic net8.0 leg (Core + Host) on the OSes the VS Code extension targets.
  # The VSIX project only exists on the net8.0-windows TFM, which the csproj drops off-Windows,
  # so restore/build here never touch the VS SDK. This is also where the bash dialect of
  # ShellStateProtocol runs against a real /bin/bash.
  test-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # ⚠ macOS gates the verdict like every other leg, and it has to: it is the ONLY one that can
    # see a path guard compare case-sensitively on a volume that folds, or a symlink resolved one
    # component at a time. A leg that decides nothing is a leg nobody reads — this one was red for
    # two days while two releases were tagged through it.

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # ⚠ Three steps rather than one, each with its own budget. A job killed by `timeout-minutes`
      # uploads NO log at all, so the only thing readable from outside is the per-step status —
      # granular enough to say WHERE it hung, and nothing else is. `dotnet test` alone restores,
      # builds and runs: collapsing the three made "the macOS leg hangs" unanswerable, and
      # --blame-hang cannot name a test when the tests never started.
      - name: Restore (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet restore Inferpal.Tests/Inferpal.Tests.csproj

      - name: Build (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet build Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

      # `--blame-hang` names the test when the hang is inside one; the detailed logger covers the
      # case where it is not (a host that never exits once every test has passed).
      #
      # ⚠ SETTLED, do not reinstate an in-shell watchdog a third time. Three independent timers
      # inside this job cannot end a hung step here: `--blame-hang` at 5 min (silent — so the hang
      # is not inside a test), an in-shell watchdog at 10 min killing the host by name, and the
      # step's own `timeout-minutes` at 12. Measured again at 18 minutes elapsed, all three past
      # due. A process we control would have died to at least one of them: what is wedged is the
      # AGENT, which is also why no log is ever uploaded. The watchdog was brought back on the
      # hypothesis that a pipe-holding orphan had defeated it; this run refuted that, and keeping a
      # guard that does not fire is worse than having none.
      - name: Test (net8.0 editor-agnostic slice)
        timeout-minutes: 12
        run: |
          set +e
          dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 5m \
            > test-output.log 2>&1
          code=$?
          echo "dotnet test exit=$code"
          exit $code

      # Runs even when the step above was killed by its own budget: that is the whole point.
      - name: Test output (tail)
        if: always()
        run: |
          echo "── last 3000 lines of the test output ──"
          tail -n 3000 test-output.log || echo "no test-output.log was produced"

  # ⚠ A MEASUREMENT with one question, and it comes out the moment it answers.
  #
  # The question: is the hang caused by the tests added in the batch it started with? The macOS leg
  # ran this suite in 168s, 175s and 188s across three runs — including the one that FAILED on an
  # assertion, so it completed — and then hung past 18 minutes, twice. It is therefore not volume
  # and not duration: something in that batch is implicated, or nothing in the job is.
  #
  # Isolation by REMOVAL, not by selection: running only the three new classes could pass trivially
  # while what hangs is their interaction with the rest of the host. This runs everything EXCEPT
  # them. Terminates ⇒ named to three files. Hangs ⇒ they are cleared, and the agent is the subject.
  macos-bisect:
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet build Inferpal.Tests/Inferpal.Tests.csproj -c Release

      - name: Test (everything except the batch under suspicion)
        timeout-minutes: 10
        run: |
          set +e
          dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName!~OAuthRedirectTests&FullyQualifiedName!~TeardownDoesNotThrowTests&FullyQualifiedName!~ClampedDepthTests" \
            --logger "console;verbosity=normal" > bisect.log 2>&1
          code=$?
          echo "dotnet test exit=$code"
          exit $code

      - name: Bisect output (tail)
        if: always()
        run: tail -n 100 bisect.log || echo "no bisect.log was produced"

  # VS Code extension: typecheck + bundle (no Windows dependency — cheaper runner)
  vscode-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Typecheck
        working-directory: vscode
        run: npm run typecheck

      - name: Bundle
        working-directory: vscode
        run: npm run build
