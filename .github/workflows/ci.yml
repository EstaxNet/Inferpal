name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # A job without a budget turns one hung test into the runner's six-hour default, and the
    # log is only uploaded when the job ENDS — so the hang costs an hour and names nothing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Inferpal.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Inferpal/Inferpal.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

  # §23: editor-agnostic net8.0 leg (Core + Host) on the OSes the VS Code extension targets.
  # The VSIX project only exists on the net8.0-windows TFM, which the csproj drops off-Windows,
  # so restore/build here never touch the VS SDK. This is also where the bash dialect of
  # ShellStateProtocol runs against a real /bin/bash.
  test-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # ⚠ Three steps rather than one, each with its own budget. A job killed by `timeout-minutes`
      # uploads NO log at all, so the only thing readable from outside is the per-step status —
      # granular enough to say WHERE it hung, and nothing else is. `dotnet test` alone restores,
      # builds and runs: collapsing the three made "the macOS leg hangs" unanswerable, and
      # --blame-hang cannot name a test when the tests never started.
      - name: Restore (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet restore Inferpal.Tests/Inferpal.Tests.csproj

      - name: Build (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet build Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

      # ⚠ The kill has to be OURS. `timeout-minutes` asks the runner to stop the step, and a test
      # host that does not answer keeps it running anyway — measured: a step budgeted at 12 minutes
      # still in progress at 24. The job budget then kills the whole runner, and a job killed that
      # way uploads NO log, which is how four runs in a row produced "it hung" and nothing else.
      # A watchdog inside the step ends it on OUR terms, so the step completes, the job completes,
      # and everything printed up to the kill is uploaded — including which test was running.
      # `--blame-hang` still names the test when the hang is inside one; the detailed logger covers
      # the case where it is not (a host that never exits once every test has passed).
      - name: Test (net8.0 editor-agnostic slice)
        timeout-minutes: 20
        run: |
          set +e
          # ⚠ Two things the previous watchdog got wrong, both measured on a leg that hung anyway:
          #  · the output goes to a FILE, not to the step's pipe. A surviving `testhost` holding
          #    that pipe keeps the step alive even after its parent is gone, so killing `dotnet`
          #    alone ended nothing. Writing to a file means no child can hold the step open, and we
          #    print the tail ourselves once we are back in control.
          #  · `set -m` puts the run in its own process group and the kill targets the GROUP
          #    (`-$runner`), so `testhost` goes with its parent. TERM first, KILL if it lingers.
          set -m
          dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 5m \
            > test-output.log 2>&1 &
          runner=$!
          (
            sleep 600
            echo "::warning::watchdog: killing the dotnet test process group after 600 s"
            kill -TERM -"$runner" 2>/dev/null
            sleep 20
            kill -KILL -"$runner" 2>/dev/null
          ) &
          watchdog=$!
          wait $runner
          code=$?
          kill "$watchdog" 2>/dev/null
          echo "── last 2000 lines of the test output ──"
          tail -n 2000 test-output.log
          echo "dotnet test exit=$code"
          exit $code

  # VS Code extension: typecheck + bundle (no Windows dependency — cheaper runner)
  vscode-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Typecheck
        working-directory: vscode
        run: npm run typecheck

      - name: Bundle
        working-directory: vscode
        run: npm run build
