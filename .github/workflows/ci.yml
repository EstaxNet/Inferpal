name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # A job without a budget turns one hung test into the runner's six-hour default, and the
    # log is only uploaded when the job ENDS — so the hang costs an hour and names nothing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Inferpal.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Inferpal/Inferpal.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

  # §23: editor-agnostic net8.0 leg (Core + Host) on the OSes the VS Code extension targets.
  # The VSIX project only exists on the net8.0-windows TFM, which the csproj drops off-Windows,
  # so restore/build here never touch the VS SDK. This is also where the bash dialect of
  # ShellStateProtocol runs against a real /bin/bash.
  test-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # ⚠ Three steps rather than one, each with its own budget. A job killed by `timeout-minutes`
      # uploads NO log at all, so the only thing readable from outside is the per-step status —
      # granular enough to say WHERE it hung, and nothing else is. `dotnet test` alone restores,
      # builds and runs: collapsing the three made "the macOS leg hangs" unanswerable, and
      # --blame-hang cannot name a test when the tests never started.
      - name: Restore (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet restore Inferpal.Tests/Inferpal.Tests.csproj

      - name: Build (net8.0 editor-agnostic slice)
        timeout-minutes: 10
        run: dotnet build Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

      # --blame-hang NAMES the test that never returned, when it is a test that hangs. The budget
      # is generous next to the 2.5 minutes this leg takes, so it only fires on a real hang.
      - name: Test (net8.0 editor-agnostic slice)
        timeout-minutes: 12
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 5m

  # VS Code extension: typecheck + bundle (no Windows dependency — cheaper runner)
  vscode-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Typecheck
        working-directory: vscode
        run: npm run typecheck

      - name: Bundle
        working-directory: vscode
        run: npm run build
