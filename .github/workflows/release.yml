name: Release

# Push a tag v<version> (matching <Version> in Directory.Build.props) and this
# builds BOTH extensions and attaches them — plus SHA256SUMS.txt — to a GitHub
# Release. Local equivalent: .\release.ps1
on:
  push:
    tags: ['v*']

# The release for a tag is written once. Two runs on the same ref — a manual re-dispatch, a
# re-run of a flaky step, a force-pushed tag — would both reach the upload step, and
# `action-gh-release` REPLACES same-named assets in place. Builds are not byte-reproducible
# (zip entries carry wall-clock time), so the second run silently changes the bytes and the
# SHA256SUMS.txt of a release people may already have downloaded and verified. Queue, never
# cancel: cancelling mid-upload is the one way to leave a release half-written.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Check tag matches Directory.Build.props
        shell: pwsh
        # ⚠ The tag arrives through `env:`, never interpolated into the script body. A `${{ }}`
        # expression inside a `run:` block is substituted as TEXT before the shell parses it, so a
        # tag carrying a quote closes the string and the rest of its name runs as PowerShell. Only
        # someone with push access can create a tag here, which is why this is a hardening fix and
        # not an incident — but it is the one pattern GitHub's own guidance says never to write,
        # and the correct form costs a line.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') { throw 'No <Version> in Directory.Build.props' }
          $version = $Matches[1]
          $tag = $env:TAG_NAME.TrimStart('v')
          if ($tag -ne $version) { throw "Tag v$tag does not match Directory.Build.props <Version>$version</Version> - bump the props (or the tag) first." }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      # The release is the trust anchor: `Test-ArtifactProvenance` proves a published binary by
      # comparing its hash to the SHA256SUMS.txt of THIS job. That premise holds only while the
      # assets are immutable, so a re-run over an existing release must stop here rather than
      # rewrite it. Deleting the release (or the tag) is a deliberate human act; overwriting it
      # by accident is not. Set ALLOW_RELEASE_OVERWRITE=true on a manual dispatch to bypass.
      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $existing = gh release view $env:TAG_NAME --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            if ($env:ALLOW_RELEASE_OVERWRITE -eq 'true') {
              Write-Host "::warning::release $existing exists; overwriting on explicit request"
            } else {
              throw "A release already exists for $env:TAG_NAME. Its assets and SHA256SUMS.txt are what provenance checks against, so this job will not rewrite them. Delete the release deliberately, or publish a new version."
            }
          } else {
            Write-Host "no release for $env:TAG_NAME yet - proceeding"
          }

      - name: Restore
        run: dotnet restore Inferpal.sln

      - name: Test
        run: dotnet test Inferpal.Tests/Inferpal.Tests.csproj -c Release --no-restore

      - name: Build VS 2026 VSIX
        run: dotnet build Inferpal/Inferpal.csproj -c Release --no-restore

      # ⚠ THE content gate, and it runs HERE because this is the path that actually publishes.
      # Five releases -- 1.6.0 through 1.6.5 -- shipped with SDK-pruned assemblies, and every
      # check written to catch that lived in the release tooling, which is private and therefore
      # absent from the tree this runner checks out. The bytes attached below are the ones people
      # download and the ones a provenance check treats as ground truth; until now they were the
      # only artifact in the whole chain that no content gate ever opened.
      - name: Verify the VS package carries what the build declares
        shell: pwsh
        run: ./tools/verify-vsix-payload.ps1 -Vsix Inferpal/bin/Release/net8.0-windows/Inferpal.vsix -RepoRoot .

      - name: Install extension dependencies
        working-directory: vscode
        run: npm ci

      # §23: one VSIX per platform, same version (Marketplace requirement). The host is
      # cross-published self-contained from this Windows runner (no AOT/R2R involved);
      # the exec bit lost by zip-on-Windows is re-asserted by the extension at activation.
      - name: Build VS Code VSIX (win32-x64, bundled self-contained host)
        shell: pwsh
        run: ./vscode/package.ps1 -Target win32-x64

      - name: Build VS Code VSIX (linux-x64)
        shell: pwsh
        run: ./vscode/package.ps1 -Target linux-x64

      - name: Build VS Code VSIX (darwin-arm64)
        shell: pwsh
        run: ./vscode/package.ps1 -Target darwin-arm64

      - name: Assemble deliverables + checksums
        shell: pwsh
        run: |
          $dist = "dist/$env:VERSION"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "Inferpal/bin/Release/net8.0-windows/Inferpal.vsix" "$dist/Inferpal-vs2026-$env:VERSION.vsix"
          foreach ($target in 'win32-x64', 'linux-x64', 'darwin-arm64') {
              Copy-Item "vscode/inferpal-$target-$env:VERSION.vsix" "$dist/inferpal-vscode-$target-$env:VERSION.vsix"
          }
          $sums = Get-ChildItem $dist -Filter '*.vsix' | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [System.IO.File]::WriteAllText("$dist/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-ChildItem $dist | ForEach-Object { Write-Host "  $($_.Name)  ($([math]::Round($_.Length/1MB,1)) MB)" }

      # ⚠ Pinned to a commit, not to `@v3`. This is the only THIRD-PARTY action in the repository
      # and the only step that runs with `contents: write`: a moving major tag means whoever
      # controls that upstream account can, at any later date, run their code with permission to
      # publish assets under this project's releases. For a product whose whole claim is "runs
      # locally, trust the binary you download", the release job is the trust anchor — and the
      # SHA256SUMS.txt written two steps above proves nothing against an attacker inside the job.
      # The `actions/*` steps keep their major tags on purpose: first-party, and pinning them would
      # mean hand-bumping their security updates. Bump this SHA deliberately, from the tag you
      # intend (v3 = 3d0d9888, 2026-07-13).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Inferpal ${{ env.VERSION }}
          files: dist/${{ env.VERSION }}/*
          # A glob that matches nothing publishes an EMPTY release without failing. The assemble
          # step above is what fills that folder; if it ever silently produces less, the release
          # must not be created rather than created short.
          fail_on_unmatched_files: true
          generate_release_notes: true
